<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BADBEAR.MED | Dermatología</title>
  <meta name="description" content="BADBEAR.MED Dermatología · plataforma de estudio con audio persistente.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="badbear-theme.css">
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#f5f7fb}
    body{display:flex;flex-direction:column}
    .bb-shell-header{flex:0 0 auto}
    .bb-shell-stage{position:relative;flex:1 1 auto;min-height:0;background:#f5f7fb}
    #bb-app-frame{width:100%;height:100%;border:0;display:block;background:#f5f7fb}
    body.bb-study-audio-activo .bb-shell-stage{padding-bottom:106px;box-sizing:border-box}
    @media(max-width:760px){
      body.bb-study-audio-activo .bb-shell-stage{padding-bottom:148px}
    }
  </style>
  <script src="auth.js"></script>
  <script src="theory-audio.js" defer></script>
</head>
<body>
<header class="cabecera bb-header bb-shell-header">
  <a class="marca" href="estudio.html?page=index.html" aria-label="Inicio BADBEAR.MED" data-shell-page="index.html">
    <img class="logo-badbear" src="badbear_logo.png" alt="Logo BADBEAR.MED">
    <div class="marca-texto"><h1>BADBEAR<span>.MED</span></h1><p>Dermatología</p></div>
  </a>
  <nav class="nav-principal" aria-label="Navegación principal">
    <a href="index.html" class="nav-item" data-shell-page="index.html">Inicio</a>
    <a href="banco.html" class="nav-item" data-shell-page="banco.html">Banco</a>
    <a href="examenes.html" class="nav-item" data-shell-page="examenes.html">Exámenes pasados</a>
    <a href="simulador.html" class="nav-item" data-shell-page="simulador.html">Simulador</a>
    <a href="atlas.html" class="nav-item" data-shell-page="atlas.html">Atlas</a>
    <a href="reconocimiento.html" class="nav-item" data-shell-page="reconocimiento.html">Reconocimiento</a>
    <a href="practico.html" class="nav-item" data-shell-page="practico.html">Práctico</a>
    <a href="plan.html" class="nav-item" data-shell-page="plan.html">Plan</a>
    <a href="repeticion.html" class="nav-item" data-shell-page="repeticion.html">Repetición</a>
    <a href="repaso.html" class="nav-item" data-shell-page="repaso.html">Repaso</a>
    <a href="teoria.html" class="nav-item" data-shell-page="teoria.html">Teoría</a>
    <a href="audio.html" class="nav-item" data-shell-page="audio.html">Audio</a>
    <a href="progreso.html" class="nav-item" data-shell-page="progreso.html">Progreso</a>
    <a href="historial.html" class="nav-item" data-shell-page="historial.html">Historial</a>
  </nav>
</header>

<main class="bb-shell-stage">
  <iframe id="bb-app-frame" title="Contenido BADBEAR.MED" src="index.html?bbembed=1"></iframe>
</main>

<script>
(function(){
  "use strict";

  const frame = document.getElementById("bb-app-frame");
  const permitidas = new Set([
    "index.html","banco.html","examenes.html","simulador.html","atlas.html",
    "reconocimiento.html","practico.html","plan.html","repeticion.html",
    "repaso.html","teoria.html","audio.html","progreso.html","historial.html"
  ]);

  function limpiarPagina(valor){
    if(!valor) return "index.html";
    try{
      const u = new URL(valor, location.href);
      const archivo = u.pathname.split("/").pop() || "index.html";
      if(!permitidas.has(archivo)) return "index.html";
      return archivo + u.search + u.hash;
    }catch(e){
      const archivo = String(valor).split("?")[0].split("#")[0];
      return permitidas.has(archivo) ? String(valor) : "index.html";
    }
  }

  function archivoBase(valor){
    return String(valor || "index.html").split("?")[0].split("#")[0];
  }

  function actualizarActivo(pagina){
    const base = archivoBase(pagina);
    document.querySelectorAll("[data-shell-page]").forEach(a=>{
      a.classList.toggle("nav-activo", a.dataset.shellPage === base);
    });
  }

  function navegar(pagina, actualizarURL=true){
    const destino = limpiarPagina(pagina);
    const separador = destino.includes("?") ? "&" : "?";
    frame.src = destino + separador + "bbembed=1";
    actualizarActivo(destino);
    if(actualizarURL){
      history.replaceState(null,"",`estudio.html?page=${encodeURIComponent(destino)}`);
    }
    const header = document.querySelector(".bb-header");
    const menuBtn = document.querySelector(".bb-mobile-menu-btn");
    if(header) header.classList.remove("bb-menu-abierto");
    if(menuBtn){
      menuBtn.setAttribute("aria-expanded","false");
      menuBtn.innerHTML = "☰ <span>Menú</span>";
    }
  }

  document.querySelectorAll("[data-shell-page]").forEach(a=>{
    a.addEventListener("click", e=>{
      e.preventDefault();
      navegar(a.dataset.shellPage);
    });
  });

  frame.addEventListener("load",()=>{
    try{
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if(!doc || !win) return;

      const ocultar = doc.createElement("style");
      ocultar.textContent = `
        .bb-header,.cabecera.bb-header,body>footer,.bb-auth-logout{display:none!important}
        body{padding-top:0!important;margin-top:0!important}
        .exam-main,.atlas-main,.inicio-badbear,.teoria-badbear,.audio-main,.repaso-main,.progreso-badbear{margin-top:18px!important}
      `;
      doc.head.appendChild(ocultar);

      const nombre = win.location.pathname.split("/").pop() || "index.html";
      if(permitidas.has(nombre)){
        const actual = nombre + win.location.search.replace(/[?&]bbembed=1(?:&|$)/,"?").replace(/\?$/,"") + win.location.hash;
        actualizarActivo(nombre);
        history.replaceState(null,"",`estudio.html?page=${encodeURIComponent(actual)}`);
      }

      doc.querySelectorAll('a[href]').forEach(a=>{
        const href = a.getAttribute("href") || "";
        if(a.target === "_blank" || href.startsWith("http") || href.startsWith("mailto:") || href.startsWith("#")) return;
        const archivo = href.split("?")[0].split("#")[0];
        if(permitidas.has(archivo)){
          a.addEventListener("click",ev=>{
            ev.preventDefault();
            navegar(href);
          });
        }
      });
    }catch(e){}
  });

  const params = new URLSearchParams(location.search);
  navegar(params.get("page") || "index.html", false);
})();
</script>
</body>
</html>
